name: ci
on:
  push:
    branches: [idea-map]
  pull_request:
    branches: [idea-map]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Postgres 16 with pgvector, as in packages/db/compose.yaml. The password is a
      # throwaway for this job's container only.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ideamap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ideamap"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The database tests (packages/db) need this, and fail rather than skip in CI.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ideamap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Test (diagnostic)
        shell: bash
        run: |
          set +e
          pnpm -r --no-bail test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          grep -E "FAIL|AssertionError|Error:|Unhandled|ELIFECYCLE|Tests  " test.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $code
      - run: pnpm build
      # Migrate the job's database from empty, then again to show it's a no-op.
      - name: Migrations
        run: |
          pnpm --filter @ideamap/db migrate
          pnpm --filter @ideamap/db migrate | tee second-run.txt
          grep -q 'nothing to do' second-run.txt
          pnpm --filter @ideamap/db migrate:status
