<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-a7d07a3c-adc6-4530-b19c-86c8e5a12152/styles.css">
<script src="_ds/nocturne-a7d07a3c-adc6-4530-b19c-86c8e5a12152/_ds_bundle.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</helmet>
<div ref="{{ rootRef }}" style="position:relative;width:{{ px }}px;height:{{ px }}px;flex:none">
  <div style="position:absolute;left:0;top:0;width:100px;height:100px;transform-origin:0 0;transform:scale({{ k }})">
    <div data-aura="1" style="position:absolute;left:50%;top:56%;width:{{ auraSize }}px;height:{{ auraSize }}px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, var(--color-accent-600), transparent 66%);opacity:{{ auraOp }}"></div>
    <div data-shadow="1" style="position:absolute;left:26px;top:91px;width:48px;height:6px;border-radius:50%;background:rgba(0,0,0,.38)"></div>
    <div data-bob="1" style="position:absolute;inset:0">
      <div data-hop="1" style="position:absolute;inset:0;transform-origin:50% 92%">
        <div data-body="1" style="position:absolute;left:14px;top:20px;width:72px;height:72px;transform-origin:50% 100%">
          <div data-arm-l="1" style="position:absolute;left:-7px;top:40px;width:13px;height:21px;border-radius:50%;background:var(--color-accent-600);border:1px solid var(--color-accent-300);transform-origin:70% 15%;transform:rotate(22deg)"></div>
          <div data-arm-r="1" style="position:absolute;right:-7px;top:40px;width:13px;height:21px;border-radius:50%;background:var(--color-accent-600);border:1px solid var(--color-accent-300);transform-origin:30% 15%;transform:rotate(-22deg)"></div>
          <sc-if value="{{ hasSprout }}">
            <div style="position:absolute;left:35px;top:-11px;width:3px;height:14px;border-radius:2px;background:var(--color-accent-300)"></div>
            <div style="position:absolute;left:24px;top:-17px;width:13px;height:8px;border-radius:50% 0;background:var(--color-accent-300);transform:rotate(-18deg)"></div>
            <div style="position:absolute;left:37px;top:-19px;width:13px;height:8px;border-radius:0 50%;background:var(--color-accent-200);transform:rotate(18deg)"></div>
          </sc-if>
          <div style="position:absolute;inset:0;border-radius:50% 50% 44% 44% / 58% 58% 42% 42%;background:radial-gradient(circle at 34% 26%, var(--color-accent-300), var(--color-accent-600) 46%, var(--color-accent-800));border:1px solid var(--color-accent-300);box-shadow:inset 0 -7px 12px rgba(0,0,0,.28)"></div>
          <sc-if value="{{ hasCheeks }}">
            <div style="position:absolute;left:9px;top:44px;width:11px;height:6px;border-radius:50%;background:var(--color-accent-200);opacity:.45"></div>
            <div style="position:absolute;right:9px;top:44px;width:11px;height:6px;border-radius:50%;background:var(--color-accent-200);opacity:.45"></div>
          </sc-if>
          <div style="position:absolute;left:18px;top:26px;width:15px;height:18px;border-radius:50%;background:var(--color-neutral-100);overflow:hidden">
            <div data-pupil="1" style="position:absolute;left:3.5px;top:5px;width:8px;height:9px;border-radius:50%;background:var(--color-neutral-900)"><div style="position:absolute;left:1px;top:1px;width:3px;height:3px;border-radius:50%;background:var(--color-neutral-100)"></div></div>
            <div data-lid="1" style="position:absolute;left:0;top:0;width:100%;height:100%;background:var(--color-accent-500);transform-origin:50% 0;transform:scaleY({{ lid }})"></div>
          </div>
          <div style="position:absolute;left:39px;top:26px;width:15px;height:18px;border-radius:50%;background:var(--color-neutral-100);overflow:hidden">
            <div data-pupil="1" style="position:absolute;left:3.5px;top:5px;width:8px;height:9px;border-radius:50%;background:var(--color-neutral-900)"><div style="position:absolute;left:1px;top:1px;width:3px;height:3px;border-radius:50%;background:var(--color-neutral-100)"></div></div>
            <div data-lid="1" style="position:absolute;left:0;top:0;width:100%;height:100%;background:var(--color-accent-500);transform-origin:50% 0;transform:scaleY({{ lid }})"></div>
          </div>
          <div style="position:absolute;left:18px;top:{{ browYL }}px;width:14px;height:3px;border-radius:2px;background:var(--color-accent-900);transform:rotate({{ browL }}deg);transition:all 220ms ease"></div>
          <div style="position:absolute;left:40px;top:{{ browYR }}px;width:14px;height:3px;border-radius:2px;background:var(--color-accent-900);transform:rotate({{ browR }}deg);transition:all 220ms ease"></div>
          <sc-if value="{{ hasGlasses }}">
            <div style="position:absolute;left:15px;top:23px;width:17px;height:20px;border-radius:50%;border:2px solid var(--color-neutral-200)"></div>
            <div style="position:absolute;left:36px;top:23px;width:17px;height:20px;border-radius:50%;border:2px solid var(--color-neutral-200)"></div>
            <div style="position:absolute;left:34px;top:32px;width:4px;height:2px;background:var(--color-neutral-200)"></div>
          </sc-if>
          <sc-if value="{{ mSmile }}"><div style="position:absolute;left:28px;top:47px;width:16px;height:8px;border-bottom:3px solid var(--color-accent-900);border-radius:0 0 12px 12px"></div></sc-if>
          <sc-if value="{{ mOpen }}"><div style="position:absolute;left:27px;top:49px;width:18px;height:12px;background:var(--color-neutral-900);border-radius:3px 3px 12px 12px;overflow:hidden"><div style="position:absolute;left:4px;top:7px;width:10px;height:7px;border-radius:50%;background:var(--color-accent-300)"></div></div></sc-if>
          <sc-if value="{{ mO }}"><div style="position:absolute;left:32px;top:50px;width:8px;height:9px;box-sizing:border-box;border-radius:50%;border:2.5px solid var(--color-accent-900)"></div></sc-if>
          <sc-if value="{{ mWavy }}"><div style="position:absolute;left:28px;top:53px;width:16px;height:3px;border-radius:2px;background:var(--color-accent-900);transform:rotate(-12deg)"></div></sc-if>
          <sc-if value="{{ mFlat }}"><div style="position:absolute;left:31px;top:53px;width:10px;height:3px;border-radius:2px;background:var(--color-accent-900)"></div></sc-if>
          <sc-if value="{{ isConfused }}"><div style="position:absolute;right:2px;top:12px;width:7px;height:10px;border-radius:50% 50% 50% 50% / 30% 30% 70% 70%;background:var(--color-accent-100);opacity:.8"></div></sc-if>
          <sc-if value="{{ hasCap }}">
            <div style="position:absolute;left:23px;top:-3px;width:26px;height:9px;background:var(--color-neutral-900);border-radius:0 0 5px 5px"></div>
            <div style="position:absolute;left:12px;top:-14px;width:48px;height:16px;background:var(--color-neutral-900);border:1px solid var(--color-accent-400);transform:perspective(70px) rotateX(52deg)"></div>
            <div style="position:absolute;left:52px;top:-7px;width:2px;height:15px;background:var(--color-accent-200)"></div>
            <div style="position:absolute;left:50px;top:7px;width:6px;height:6px;border-radius:2px;background:var(--color-accent-200)"></div>
          </sc-if>
        </div>
      </div>
    </div>
    <sc-if value="{{ isThinking }}">
      <div style="position:absolute;left:70px;top:2px;display:flex;gap:3px">
        <span data-dot="1" style="width:6px;height:6px;border-radius:50%;background:var(--color-accent-200)"></span>
        <span data-dot="1" style="width:6px;height:6px;border-radius:50%;background:var(--color-accent-200)"></span>
        <span data-dot="1" style="width:6px;height:6px;border-radius:50%;background:var(--color-accent-200)"></span>
      </div>
    </sc-if>
    <sc-if value="{{ isSleepy }}">
      <span data-z="1" style="position:absolute;left:72px;top:10px;font:500 13px var(--font-heading);color:var(--color-accent-200)">z</span>
      <span data-z="1" style="position:absolute;left:80px;top:0;font:500 10px var(--font-heading);color:var(--color-accent-200)">z</span>
    </sc-if>
    <div data-fx="1" style="position:absolute;inset:0;pointer-events:none"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;happy&quot;,&quot;curious&quot;,&quot;confused&quot;,&quot;aha&quot;,&quot;excited&quot;,&quot;thinking&quot;,&quot;sleepy&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:4,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:40,&quot;max&quot;:200,&quot;default&quot;:160,&quot;tsType&quot;:&quot;number&quot;},&quot;pulse&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}">
const FACE = {
  idle: [0, 0, 20, 20, 'smile'], happy: [0, 0, 17, 17, 'smile'], curious: [-12, 0, 14, 20, 'o'],
  confused: [-16, 16, 18, 18, 'wavy'], aha: [0, 0, 12, 12, 'open'], excited: [0, 0, 14, 14, 'open'],
  thinking: [-10, 4, 15, 19, 'flat'], sleepy: [0, 0, 22, 22, 'flat']
};
class Component extends DCLogic {
  rootRef = el => { this._el = el; };
  q(s) { return this._el ? this._el.querySelector(s) : null; }
  qa(s) { return this._el ? [...this._el.querySelectorAll(s)] : []; }
  componentDidMount() {
    this._mood = this.props.mood; this._stage = +this.props.stage || 1; this._pulse = this.props.pulse;
    const bob = this.q('[data-bob]'), sh = this.q('[data-shadow]');
    if (bob) bob.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-3px)' }], { duration: 1700, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
    if (sh) sh.animate([{ transform: 'scaleX(1)', opacity: 1 }, { transform: 'scaleX(.86)', opacity: .7 }], { duration: 1700, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
    window.addEventListener('pointermove', this.look);
    const loop = () => { this._bt = setTimeout(() => { this.blink(); loop(); }, 2600 + Math.random() * 2400); };
    loop();
    this.moodAnim();
  }
  componentWillUnmount() { clearTimeout(this._bt); window.removeEventListener('pointermove', this.look); }
  componentDidUpdate() {
    const st = +this.props.stage || 1;
    if (st > this._stage) this.evolve();
    this._stage = st;
    if (this.props.mood !== this._mood || this.props.pulse !== this._pulse) { this._mood = this.props.mood; this._pulse = this.props.pulse; this.moodAnim(); }
  }
  look = ev => {
    const el = this._el; if (!el) return;
    const m = this.props.mood;
    let dx = 0, dy = 0;
    if (m === 'thinking') { dx = -2; dy = -3; }
    else if (m !== 'sleepy') {
      const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * 0.4;
      const a = Math.atan2(ev.clientY - cy, ev.clientX - cx), d = Math.min(1, Math.hypot(ev.clientX - cx, ev.clientY - cy) / 300);
      dx = Math.cos(a) * 3 * d; dy = Math.sin(a) * 2.8 * d;
    }
    this.qa('[data-pupil]').forEach(p => { p.style.transform = 'translate(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px)'; });
  };
  blink() {
    if (this.props.mood === 'sleepy') return;
    this.qa('[data-lid]').forEach(l => l.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }, { transform: 'scaleY(0)' }], { duration: 170, easing: 'ease-in-out' }));
  }
  pop(icon) {
    const fx = this.q('[data-fx]'); if (!fx) return;
    const i = document.createElement('i');
    i.className = icon;
    i.style.cssText = 'position:absolute;left:70px;top:-6px;font-size:22px;color:var(--color-accent-100);text-shadow:0 0 12px var(--color-accent-500)';
    fx.appendChild(i);
    i.animate([{ transform: 'scale(0) translateY(10px)', opacity: 0 }, { transform: 'scale(1.35) translateY(-4px)', opacity: 1, offset: .25 }, { transform: 'scale(1) translateY(-8px)', opacity: 1, offset: .75 }, { transform: 'scale(.9) translateY(-16px)', opacity: 0 }], { duration: 1400, easing: 'ease-out' }).onfinish = () => i.remove();
  }
  sparkle(n, spread) {
    const fx = this.q('[data-fx]'); if (!fx) return;
    for (let k = 0; k < n; k++) {
      const d = document.createElement('span'), a = Math.random() * Math.PI * 2, r = (spread || 48) * (0.6 + Math.random() * 0.6), s = 3 + Math.random() * 4;
      d.style.cssText = 'position:absolute;left:50px;top:55px;width:' + s + 'px;height:' + s + 'px;margin:-' + s / 2 + 'px;border-radius:50%;background:var(--color-accent-100);box-shadow:0 0 8px var(--color-accent-400)';
      fx.appendChild(d);
      d.animate([{ transform: 'translate(0,0) scale(.4)', opacity: 1 }, { transform: 'translate(' + Math.cos(a) * r + 'px,' + Math.sin(a) * r + 'px) scale(1)', opacity: 0 }], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.1,.7,.3,1)' }).onfinish = () => d.remove();
    }
  }
  moodAnim() {
    const m = this.props.mood || 'idle', hop = this.q('[data-hop]'), body = this.q('[data-body]'), aL = this.q('[data-arm-l]'), aR = this.q('[data-arm-r]');
    if (!hop || !body) return;
    [hop, body, aL, aR].forEach(e => e && e.getAnimations().forEach(a => a.cancel()));
    if (m === 'aha') {
      hop.animate([{ transform: 'none' }, { transform: 'translateY(2px) scale(1.12,.86)', offset: .15 }, { transform: 'translateY(-24px) scale(.9,1.12)', offset: .45 }, { transform: 'translateY(0) scale(1.08,.92)', offset: .8 }, { transform: 'none' }], { duration: 720, easing: 'ease-out' });
      setTimeout(() => this.pop('ph-fill ph-lightbulb'), 200); this.sparkle(8);
    } else if (m === 'excited') {
      hop.animate([0, 1, 2, 3].flatMap(() => [{ transform: 'translateY(0) scale(1.06,.94)' }, { transform: 'translateY(-14px) scale(.96,1.05)' }]).concat([{ transform: 'none' }]), { duration: 1100, easing: 'ease-in-out' });
      if (aL) aL.animate([{ transform: 'rotate(22deg)' }, { transform: 'rotate(140deg)' }], { duration: 180, iterations: 6, direction: 'alternate' });
      if (aR) aR.animate([{ transform: 'rotate(-22deg)' }, { transform: 'rotate(-140deg)' }], { duration: 180, iterations: 6, direction: 'alternate' });
      this.sparkle(14, 60); setTimeout(() => this.pop('ph-fill ph-star'), 150);
    } else if (m === 'confused') {
      body.animate([0, -9, 8, -6, 4, -2, 0].map(r => ({ transform: 'rotate(' + r + 'deg)' })), { duration: 900, easing: 'ease-out' });
      setTimeout(() => this.pop('ph-bold ph-question'), 150);
    } else if (m === 'curious') {
      body.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(10deg)' }], { duration: 450, fill: 'forwards', easing: 'cubic-bezier(.2,.8,.2,1.5)' });
      if (aR) aR.animate([{ transform: 'rotate(-22deg)' }, { transform: 'rotate(-120deg)' }], { duration: 400, fill: 'forwards', easing: 'ease-out' });
    } else if (m === 'thinking') {
      body.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-6deg)' }], { duration: 500, fill: 'forwards' });
      requestAnimationFrame(() => this.qa('[data-dot]').forEach((d, i) => d.animate([{ opacity: .2, transform: 'translateY(0)' }, { opacity: 1, transform: 'translateY(-4px)' }], { duration: 450, delay: i * 150, iterations: Infinity, direction: 'alternate' })));
    } else if (m === 'sleepy') {
      body.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.04,.96)' }], { duration: 2200, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
      requestAnimationFrame(() => this.qa('[data-z]').forEach((z, i) => z.animate([{ opacity: 0, transform: 'translate(0,6px)' }, { opacity: 1, offset: .3 }, { opacity: 0, transform: 'translate(8px,-14px)' }], { duration: 2400, delay: i * 1100, iterations: Infinity })));
    } else if (m === 'happy') {
      hop.animate([{ transform: 'none' }, { transform: 'translateY(-8px)' }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
    }
  }
  evolve() {
    const hop = this.q('[data-hop]'), aura = this.q('[data-aura]');
    if (hop) hop.animate([{ transform: 'rotateY(0) scale(1)' }, { transform: 'rotateY(360deg) scale(1.35)', offset: .5 }, { transform: 'rotateY(720deg) scale(1)' }], { duration: 1200, easing: 'cubic-bezier(.3,.7,.2,1)' });
    if (aura) aura.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(2.4)', opacity: 0 }], { duration: 1100, easing: 'ease-out' });
    setTimeout(() => { this.sparkle(22, 70); this.pop('ph-fill ph-arrow-fat-up'); }, 550);
  }
  renderVals() {
    const m = this.props.mood || 'idle', st = Math.max(1, Math.min(4, +this.props.stage || 1)), size = +this.props.size || 100;
    const F = FACE[m] || FACE.idle;
    return {
      rootRef: this.rootRef, px: size, k: size / 100,
      browL: F[0], browR: F[1], browYL: F[2], browYR: F[3],
      mSmile: F[4] === 'smile', mOpen: F[4] === 'open', mO: F[4] === 'o', mWavy: F[4] === 'wavy', mFlat: F[4] === 'flat',
      lid: m === 'sleepy' ? 0.55 : 0,
      hasCheeks: m === 'happy' || m === 'aha' || m === 'excited',
      isThinking: m === 'thinking', isSleepy: m === 'sleepy', isConfused: m === 'confused',
      hasSprout: st === 2 || st === 3, hasGlasses: st >= 3, hasCap: st >= 4,
      auraSize: 70 + st * 14, auraOp: 0.18 + st * 0.12
    };
  }
}
</script>
</body>
</html>
